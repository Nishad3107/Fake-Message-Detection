name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Python syntax
        run: python -m compileall -q backend/app backend/tests
      - name: Ruff
        run: python -m ruff check backend/app backend/tests
      - name: Black check
        run: python -m black --check backend/app backend/tests
      - name: Backend tests with CI fixture
        env:
          CI: "true"
        run: PYTHONPATH=backend pytest -q backend/tests

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test -- --run
      - name: Production build and type check
        run: npm run build

  repository:
    name: Repository policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Git diff check
        run: git diff --check
      - name: Tracked-file and secret checks
        run: tools/ci_repository_checks.sh
