services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      DATABASE_PATH: /app/runtime/history.db
    volumes: ["./backend/models:/app/models:ro", "history-data:/app/runtime"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  history-data:
